services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge_password
      POSTGRES_DB: flowforge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowforge-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: 'docker'
      PORT: 5000
      DATABASE_URL: 'postgresql://flowforge:flowforge_password@postgres:5432/flowforge'
      JWT_SECRET: 'luffy'
      REFRESH_SECRET: 'luffy'
      BCRYPT_ROUNDS: 10
      ACCESS_TOKEN_EXPIRY: '15m'
      REFRESH_TOKEN_EXPIRY: '7d'
      CORS_ORIGIN: 'http://localhost:3000'
      UPLOAD_DIR: './uploads'
      MAX_FILE_SIZE: 5242880
    volumes:
      - ./FlowForge_BE/uploads:/app/uploads
      - ./FlowForge_BE/logs:/app/logs
    depends_on:
      - postgres

  frontend:
    build:
      context: ../fe
      dockerfile: Dockerfile
    container_name: flowforge-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
